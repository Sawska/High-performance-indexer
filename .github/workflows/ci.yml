name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features
        continue-on-error: true

  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo build
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked

  schema:
    name: schema applies
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexer -d indexer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: apply schema.sql twice
        env:
          PGPASSWORD: indexer
        run: |
          psql -h localhost -U indexer -d indexer -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U indexer -d indexer -v ON_ERROR_STOP=1 -f schema.sql

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pred-market-indexer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: binary runs
        run: docker run --rm --entrypoint sh pred-market-indexer:ci -c 'command -v pred-market-indexer'

  web:
    name: web lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
