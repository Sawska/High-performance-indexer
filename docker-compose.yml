services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: indexer
      CLICKHOUSE_USER: indexer
      CLICKHOUSE_PASSWORD: indexer
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://indexer:indexer@postgres:5432/indexer

      ASSET_IDS: "${ASSET_IDS:-}"

      # Set to true once the UI is served over HTTPS.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

      SCRAPE_INTERVAL_SECS: "${SCRAPE_INTERVAL_SECS:-300}"
      SCRAPE_CONCURRENCY: "${SCRAPE_CONCURRENCY:-8}"
      SCRAPE_MAX_MARKETS: "${SCRAPE_MAX_MARKETS:-0}"
      SCRAPE_MAX_MARKETS_DEEP: "${SCRAPE_MAX_MARKETS_DEEP:-500}"
      SCRAPE_WALLETS_PER_CYCLE: "${SCRAPE_WALLETS_PER_CYCLE:-200}"

      # ── on-chain (Polygon) indexer ──
      # Off by default; set CHAIN_ENABLED=true to start following Polygon logs.
      CHAIN_ENABLED: "${CHAIN_ENABLED:-false}"
      CHAIN_RPC_URL: "${CHAIN_RPC_URL:-https://polygon-bor-rpc.publicnode.com}"

      # 0 means "start CHAIN_INITIAL_LOOKBACK blocks behind the head". Set an
      # explicit block to backfill; a stored cursor always takes precedence.
      CHAIN_START_BLOCK: "${CHAIN_START_BLOCK:-0}"
      CHAIN_INITIAL_LOOKBACK: "${CHAIN_INITIAL_LOOKBACK:-100000}"

      # Tuned for a free public RPC: small log ranges, few requests in flight.
      CHAIN_LOG_RANGE: "${CHAIN_LOG_RANGE:-1000}"
      CHAIN_CONCURRENCY: "${CHAIN_CONCURRENCY:-2}"
      CHAIN_CONFIRMATIONS: "${CHAIN_CONFIRMATIONS:-64}"
      CHAIN_POLL_SECS: "${CHAIN_POLL_SECS:-5}"
      CHAIN_MAX_RETRIES: "${CHAIN_MAX_RETRIES:-5}"
      CHAIN_BACKOFF_MS: "${CHAIN_BACKOFF_MS:-500}"
      CHAIN_BLOCK_BATCH: "${CHAIN_BLOCK_BATCH:-100}"
      CHAIN_FETCH_BLOCK_TIMES: "${CHAIN_FETCH_BLOCK_TIMES:-true}"

      # Feeds can be switched off individually; the ERC-1155 and collateral
      # transfer feeds are by far the highest volume.
      CHAIN_FEED_EXCHANGE: "${CHAIN_FEED_EXCHANGE:-true}"
      CHAIN_FEED_CTF: "${CHAIN_FEED_CTF:-true}"
      CHAIN_FEED_TOKENS: "${CHAIN_FEED_TOKENS:-true}"
      CHAIN_FEED_COLLATERAL: "${CHAIN_FEED_COLLATERAL:-true}"

      CLICKHOUSE_URL: "${CLICKHOUSE_URL:-http://clickhouse:8123}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-indexer}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-indexer}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-indexer}"
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
