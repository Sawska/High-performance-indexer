[package]
name = "pred-market-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio-tungstenite = {version = "0.30.0", features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"
url = "2.5.8"
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["query", "json"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = "0.4"
clickhouse = { version = "0.15.2", features = ["chrono", "native-tls"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
argon2 = "0.5"
axum-extra = { version = "0.10", features = ["cookie"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"
