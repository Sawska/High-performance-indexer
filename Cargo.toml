[package]
name = "pred-market-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio-tungstenite = {version = "0.30.0", features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"
url = "2.5.8"
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["query", "json"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = "0.4"
